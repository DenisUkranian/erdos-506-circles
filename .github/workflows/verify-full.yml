name: full-verification-manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ unzip
      - name: Download canonical proof archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --pattern Erdos506.zip --dir verification
      - name: Check archive
        run: cd verification && sha256sum -c Erdos506.zip.sha256
      - name: Extract
        run: mkdir extracted && unzip -q verification/Erdos506.zip -d extracted
      - name: Full replay
        run: cd extracted/Erdos506 && python3 verify.py --full | tee ../../full-replay.log
      - uses: actions/upload-artifact@v4
        with:
          name: full-replay-log
          path: full-replay.log
