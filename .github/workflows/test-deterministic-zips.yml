name: test-deterministic-source-zips

on:
  push:
    branches: [main]
    paths:
      - .github/test-zips-trigger.txt

permissions:
  issues: write
  contents: read

jobs:
  test-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate each source ZIP twice
        id: zips
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/zips
          {
            echo "PWD=$PWD"
            python3 --version
            find paper -maxdepth 2 -type f | sort
            python3 tools/make_deterministic_zip.py --base paper --output /tmp/zips/a1.zip paper/main.tex paper/references.bib paper/main-sections
            python3 tools/make_deterministic_zip.py --base paper --output /tmp/zips/a2.zip paper/main.tex paper/references.bib paper/main-sections
            cmp /tmp/zips/a1.zip /tmp/zips/a2.zip
            python3 tools/make_deterministic_zip.py --base paper --output /tmp/zips/s1.zip paper/supplement.tex paper/supplement-sections
            python3 tools/make_deterministic_zip.py --base paper --output /tmp/zips/s2.zip paper/supplement.tex paper/supplement-sections
            cmp /tmp/zips/s1.zip /tmp/zips/s2.zip
            sha256sum /tmp/zips/a1.zip /tmp/zips/s1.zip | tee /tmp/zips/hashes.txt
          } > /tmp/zips/diagnostic.log 2>&1
          rc=$?
          echo "rc=$rc" >> /tmp/zips/diagnostic.log
          exit $rc

      - name: Report diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.zips.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            hashes="$(sed 's#/tmp/zips/a1.zip#arxiv-source.zip#; s#/tmp/zips/s1.zip#supplement-source.zip#' /tmp/zips/hashes.txt)"
            gh issue comment 1 --body "### Deterministic ZIP diagnostic passed\n\nBoth source archives were generated twice and were byte-for-byte identical.\n\n\`\`\`text\n${hashes}\n\`\`\`"
          else
            log="$(tail -80 /tmp/zips/diagnostic.log)"
            gh issue comment 1 --body "### Deterministic ZIP diagnostic failed with log\n\n\`\`\`text\n${log}\n\`\`\`"
            exit 1
          fi
