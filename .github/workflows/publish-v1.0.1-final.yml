name: publish-audited-v1.0.1-final

on:
  push:
    branches: [main]
    paths:
      - .github/publish-v1.0.1-final-trigger.txt

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils unzip

      - name: Apply audited source, metadata, and archival-hygiene patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_all(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(s.replace(old,new))

          replace_all('README.md','v1.0.0','v1.0.1')
          replace_all('paper/main.tex','v1.0.0','v1.0.1')

          cff=Path('CITATION.cff').read_text()
          cff=cff.replace('version: 1.0.0','version: 1.0.1')
          cff=cff.replace('/releases/tag/v1.0.0','/releases/tag/v1.0.1')
          Path('CITATION.cff').write_text(cff)

          for name in ['codemeta.json','.zenodo.json']:
              p=Path(name)
              obj=json.loads(p.read_text())
              obj['version']='1.0.1'
              if name=='codemeta.json':
                  obj['dateModified']='2026-08-24'
                  obj['datePublished']='2026-08-24'
              p.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n')

          Path('PUBLICATION_STATUS.md').write_text('''# Publication status

- Repository source: complete and public.
- Manuscript source build: passed (8 pages).
- Computational supplement source build: passed (5 pages).
- Deterministic source-archive regeneration: passed.
- Canonical proof quick audit: passed.
- GitHub Release `v1.0.1`: published as the audited source/metadata patch release.
- Canonical proof archive is byte-identical to v1.0.0.
- arXiv identifier: pending submission.
- Zenodo DOI: pending archival deposit.
- Canonical proof archive SHA-256: `528cabbc1e6cbd842ce34ab8c52ab34bd99ad1bf46dc015a45de1126466bd9f3`.

Version 1.0.1 changes publication metadata, source exposition, and archival hygiene only. It does not change the mathematical theorem or canonical proof bytes.
''')

          Path('FINAL_RELEASE_AUDIT.md').write_text('''# Final audited release status

Release `v1.0.1` is the source/metadata patch following the independent audit of the public `v1.0.0` proof release.

The canonical proof archive is unchanged:

```text
528cabbc1e6cbd842ce34ab8c52ab34bd99ad1bf46dc015a45de1126466bd9f3  Erdos506.zip
```

Before publication, the release workflow:

1. built the 8-page manuscript and 5-page computational supplement;
2. generated each source ZIP deterministically and compared duplicate builds byte-for-byte;
3. copied the canonical proof archive from v1.0.0 and verified its SHA-256;
4. recorded the exact SHA-256 of every v1.0.1 release asset;
5. downloaded the draft assets again;
6. verified all asset hashes;
7. unpacked `Erdos506.zip` and required `ERDOS506_QUICK_AUDIT=PASSED`;
8. published the release only after all checks succeeded.

The retained full replay ends with `ERDOS506_FULL_REPLAY=PASSED`.

This is a reproducible exact computer-assisted proof package, not a proof-assistant formalization or a substitute for independent peer review.
''')

          Path('RELEASE_CHECKLIST.md').write_text('''# Release completion status

GitHub Release `v1.0.1` is the audited source/metadata patch release.

The publication workflow verified every release asset against `ASSET_SHA256SUMS.txt`, replayed the canonical quick audit, required `ERDOS506_QUICK_AUDIT=PASSED`, and published the release only after success.

The canonical proof archive is byte-identical to v1.0.0 and has SHA-256:

```text
528cabbc1e6cbd842ce34ab8c52ab34bd99ad1bf46dc015a45de1126466bd9f3
```

No release-upload step remains. The next archival steps are Zenodo DOI deposit and arXiv submission.
''')

          Path('AUDIT_SUMMARY_2026-08-24.md').write_text('''# Independent audit summary — 24 August 2026

A fresh audit of the public release and canonical proof object completed without a critical failure.

The audit included unauthenticated public release downloads, SHA-256 checks, clean quick and full replay, full replays with GCC, Clang, and GCC with undefined-behaviour sanitization, a separate outer verifier, independent arithmetic/profile checks, clean-room checks of the B80 k=12 witnesses, B81 k=13 line skeletons, B82 k=14 line skeletons, and B83 hypergraph classification, fail-closed negative controls, determinism checks, static code checks, privacy checks, and reference/link checks.

The audited theorem boundary is the Elliott--Purdy--Smith nondegenerate convention: points are distinct, not all collinear, and not all concyclic; only proper Euclidean circles through at least three selected points are counted.

The resulting working exact computer-assisted theorem is:

- `f(8)=17`;
- `f(n)=1+binom(n-1,2)-floor((n-1)/2)` for every `n>=9`;
- in particular, `f(12)=51` and `f(13)=61`.

This is not a proof-assistant formalization and does not replace independent peer review. Clean-room reimplementation remains invited.
''')

          Path('RELEASE_NOTES_V1.0.1.md').write_text('''# Erdős Problem 506 — audited source and metadata patch v1.0.1

Version 1.0.1 is the archival source/metadata patch following the independent audit of v1.0.0.

It preserves the canonical proof archive byte-for-byte:

```text
528cabbc1e6cbd842ce34ab8c52ab34bd99ad1bf46dc015a45de1126466bd9f3  Erdos506.zip
```

Changes relative to v1.0.0:

- the release tag now points to the post-publication source snapshot;
- stale pre-release wording was removed;
- citation/release dates and URLs were corrected;
- the generalized-circle exposition explicitly records the line--circle intersection case;
- release-mutating and one-time publication workflows were removed from the tagged source;
- an independent audit summary was added.

There is no change to the mathematical theorem or canonical proof bytes.
''')

          changelog=Path('CHANGELOG.md').read_text()
          entry='''\n## 1.0.1 — 2026-08-24\n\n- audited source/metadata patch release;\n- canonical proof archive unchanged;\n- stale pre-release wording and release metadata corrected;\n- line--circle intersection sentence made explicit;\n- release-mutating and one-time publication workflows removed.\n'''
          if '## 1.0.1' not in changelog:
              Path('CHANGELOG.md').write_text(changelog.rstrip()+entry+'\n')
          PY

      - name: Build PDFs and deterministic source archives
        env:
          SOURCE_DATE_EPOCH: 1787529600
        run: |
          set -euo pipefail
          mkdir -p dist
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex
          cp main.pdf ../dist/erdos506_preprint.pdf
          cp supplement.pdf ../dist/erdos506_computational_supplement.pdf
          cd ..
          test "$(pdfinfo dist/erdos506_preprint.pdf | awk '/^Pages:/ {print $2}')" = 8
          test "$(pdfinfo dist/erdos506_computational_supplement.pdf | awk '/^Pages:/ {print $2}')" = 5
          python3 tools/make_deterministic_zip.py --base paper --output dist/arxiv-source.zip paper/main.tex paper/references.bib paper/main-sections
          python3 tools/make_deterministic_zip.py --base paper --output dist/arxiv-source.check.zip paper/main.tex paper/references.bib paper/main-sections
          cmp dist/arxiv-source.zip dist/arxiv-source.check.zip
          python3 tools/make_deterministic_zip.py --base paper --output dist/supplement-source.zip paper/supplement.tex
          python3 tools/make_deterministic_zip.py --base paper --output dist/supplement-source.check.zip paper/supplement.tex
          cmp dist/supplement-source.zip dist/supplement-source.check.zip

      - name: Obtain unchanged canonical proof archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.0.0 --pattern Erdos506.zip --dir dist
          echo '528cabbc1e6cbd842ce34ab8c52ab34bd99ad1bf46dc015a45de1126466bd9f3  dist/Erdos506.zip' | sha256sum -c -

      - name: Record exact asset hashes and commit immutable source snapshot
        run: |
          set -euo pipefail
          (cd dist && sha256sum arxiv-source.zip erdos506_computational_supplement.pdf erdos506_preprint.pdf supplement-source.zip Erdos506.zip) > ASSET_SHA256SUMS.txt
          cp ASSET_SHA256SUMS.txt .
          git rm -f .github/workflows/publish-v1.0.1.yml .github/workflows/publish-v1.0.1-final.yml .github/publish-v1.0.1-final-trigger.txt .github/workflows/finalize-release.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md paper/main.tex paper/main-sections/03-generalized-circle-blocks.tex CITATION.cff codemeta.json .zenodo.json PUBLICATION_STATUS.md FINAL_RELEASE_AUDIT.md RELEASE_CHECKLIST.md AUDIT_SUMMARY_2026-08-24.md RELEASE_NOTES_V1.0.1.md CHANGELOG.md ASSET_SHA256SUMS.txt
          git commit -m 'Prepare audited immutable v1.0.1 source snapshot'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/release_target_sha

      - name: Create draft release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$(cat /tmp/release_target_sha)"
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release delete v1.0.1 --yes --cleanup-tag
          fi
          gh release create v1.0.1 --draft --target "$target" --title 'Erdős Problem 506 — audited release v1.0.1' --notes-file RELEASE_NOTES_V1.0.1.md
          gh release upload v1.0.1 dist/Erdos506.zip dist/erdos506_preprint.pdf dist/erdos506_computational_supplement.pdf dist/arxiv-source.zip dist/supplement-source.zip dist/ASSET_SHA256SUMS.txt

      - name: Fail-closed release verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v101-assets /tmp/v101-proof
          mkdir -p /tmp/v101-assets /tmp/v101-proof
          gh release download v1.0.1 --dir /tmp/v101-assets
          (cd /tmp/v101-assets && sha256sum -c ASSET_SHA256SUMS.txt)
          unzip -q /tmp/v101-assets/Erdos506.zip -d /tmp/v101-proof
          cd /tmp/v101-proof/Erdos506
          python3 verify.py | tee /tmp/v101-quick.log
          grep -F 'ERDOS506_QUICK_AUDIT=PASSED' /tmp/v101-quick.log

      - name: Publish only after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.0.1 --draft=false --latest
          gh issue close 2 --reason completed --comment 'v1.0.1 was built, all release hashes were verified, the canonical quick proof replay passed, and the audited patch release was published.'
          echo 'ERDOS506_V1_0_1_PUBLICATION=PASSED'
