name: quick-verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain verification release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f verification/Erdos506.zip ]; then
            gh release download v1.0.0 --pattern Erdos506.zip --dir verification
          fi
      - name: Check archive SHA-256
        run: cd verification && sha256sum -c Erdos506.zip.sha256
      - name: Extract
        run: mkdir extracted && unzip -q verification/Erdos506.zip -d extracted
      - name: Run quick audit
        run: cd extracted/Erdos506 && python3 verify.py
