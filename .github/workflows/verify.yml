name: quick-verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical proof archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.2 --pattern Erdos506.zip --dir verification
      - name: Run repository audit
        run: bash verify_repository.sh
