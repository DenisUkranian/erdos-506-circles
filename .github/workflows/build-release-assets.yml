name: build-and-upload-release-assets-v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/build-assets-trigger-v1.txt

permissions:
  contents: write
  issues: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Announce build start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --body "### Final deterministic release-asset build started\n\nGitHub Actions is compiling the 8-page manuscript and 5-page supplement, creating deterministic source archives, and preparing the private draft release v1.0.0."

      - name: Install TeX and PDF tools
        id: install
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Build PDFs and deterministic source archives
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_DATE_EPOCH: 1787260800
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            cd paper
            latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex
            cp main.pdf ../dist/erdos506_preprint.pdf
            cp supplement.pdf ../dist/erdos506_computational_supplement.pdf
            cd ..

            python3 tools/make_deterministic_zip.py \
              --base paper \
              --output dist/arxiv-source.zip \
              paper/main.tex paper/references.bib paper/main-sections
            python3 tools/make_deterministic_zip.py \
              --base paper \
              --output dist/arxiv-source.check.zip \
              paper/main.tex paper/references.bib paper/main-sections
            cmp dist/arxiv-source.zip dist/arxiv-source.check.zip

            # The supplement is intentionally self-contained in one canonical file.
            python3 tools/make_deterministic_zip.py \
              --base paper \
              --output dist/supplement-source.zip \
              paper/supplement.tex
            python3 tools/make_deterministic_zip.py \
              --base paper \
              --output dist/supplement-source.check.zip \
              paper/supplement.tex
            cmp dist/supplement-source.zip dist/supplement-source.check.zip

            test "$(pdfinfo dist/erdos506_preprint.pdf | awk '/^Pages:/ {print $2}')" = "8"
            test "$(pdfinfo dist/erdos506_computational_supplement.pdf | awk '/^Pages:/ {print $2}')" = "5"

            sha256sum dist/arxiv-source.zip \
                      dist/erdos506_computational_supplement.pdf \
                      dist/erdos506_preprint.pdf \
                      dist/supplement-source.zip > dist/GENERATED_ASSET_SHA256SUMS.txt
            cat dist/GENERATED_ASSET_SHA256SUMS.txt
          } 2>&1 | tee /tmp/release-build.log

      - name: Upload four generated assets to draft release
        id: upload
        if: steps.install.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.0.0 \
            dist/erdos506_preprint.pdf \
            dist/erdos506_computational_supplement.pdf \
            dist/arxiv-source.zip \
            dist/supplement-source.zip \
            dist/GENERATED_ASSET_SHA256SUMS.txt \
            --clobber 2>&1 | tee /tmp/release-upload.log

      - name: Report final workflow result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          if [ "$INSTALL_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then
            hashes="$(sed 's#  dist/#  #' dist/GENERATED_ASSET_SHA256SUMS.txt)"
            gh issue comment 1 --body "### Final deterministic release-asset build completed\n\nThe manuscript and supplement compiled with the required page counts. Both source ZIPs were regenerated twice and compared byte-for-byte. The four source-derived assets were uploaded to the private draft release v1.0.0.\n\n\`\`\`text\n${hashes}\n\`\`\`\n\nThe sole remaining upload is \`Erdos506.zip\`, expected SHA-256 \`528cabbc1e6cbd842ce34ab8c52ab34bd99ad1bf46dc015a45de1126466bd9f3\`."
            echo "GENERATED_RELEASE_ASSETS_V1=PASSED"
          else
            {
              echo "install=$INSTALL_OUTCOME build=$BUILD_OUTCOME upload=$UPLOAD_OUTCOME"
              test -f /tmp/release-build.log && tail -60 /tmp/release-build.log || true
              test -f /tmp/release-upload.log && tail -30 /tmp/release-upload.log || true
            } > /tmp/final-failure.log
            log="$(cat /tmp/final-failure.log)"
            gh issue comment 1 --body "### Final deterministic release-asset build failed\n\n\`\`\`text\n${log}\n\`\`\`"
            exit 1
          fi
