name: build-and-upload-release-assets-v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/build-assets-trigger-v1.txt

permissions:
  contents: write
  issues: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended zip

      - name: Build manuscript and supplement
        env:
          SOURCE_DATE_EPOCH: 1787260800
        run: |
          set -euo pipefail
          mkdir -p dist
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error supplement.tex
          cp main.pdf ../dist/erdos506_preprint.pdf
          cp supplement.pdf ../dist/erdos506_computational_supplement.pdf
          cd ..
          (cd paper && zip -q -r ../dist/arxiv-source.zip main.tex references.bib main-sections)
          (cd paper && zip -q -r ../dist/supplement-source.zip supplement.tex supplement-sections)
          sha256sum dist/arxiv-source.zip \
                    dist/erdos506_computational_supplement.pdf \
                    dist/erdos506_preprint.pdf \
                    dist/supplement-source.zip > dist/GENERATED_ASSET_SHA256SUMS.txt
          pdfinfo dist/erdos506_preprint.pdf | grep '^Pages:'
          pdfinfo dist/erdos506_computational_supplement.pdf | grep '^Pages:'

      - name: Upload four generated assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.0.0 \
            dist/erdos506_preprint.pdf \
            dist/erdos506_computational_supplement.pdf \
            dist/arxiv-source.zip \
            dist/supplement-source.zip \
            dist/GENERATED_ASSET_SHA256SUMS.txt \
            --clobber

      - name: Report generated hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hashes="$(sed 's#  dist/#  #' dist/GENERATED_ASSET_SHA256SUMS.txt)"
          gh issue comment 1 --body "### Automated release-asset build completed\n\nThe four source-derived assets were compiled and uploaded to the private draft release v1.0.0.\n\n\`\`\`text\n${hashes}\n\`\`\`\n\nThe only remaining binary to attach is \`Erdos506.zip\`, expected SHA-256 \`528cabbc1e6cbd842ce34ab8c52ab34bd99ad1bf46dc015a45de1126466bd9f3\`."
          echo "GENERATED_RELEASE_ASSETS_V1=PASSED"
